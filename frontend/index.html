<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📦 Sistema de Estoque</h1>
        <p>Gerenciamento de produtos</p>
    </header>

    <main>

        <section class="formulario">
            <h2 id="titulo-formulario">Cadastrar Produto</h2>

            <form id="form-produto">

                <input type="hidden" id="produto-id">

                <label for="nome">Nome do produto:</label>
                <input type="text" id="nome" required>

                <label for="preco">Preço:</label>
                <input type="number" id="preco" step="0.01" min="0.01" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="0" step="1" required>

                <button type="submit" id="botao-salvar">
                    Cadastrar Produto
                </button>

                <button type="button" id="botao-cancelar" hidden>
                    Cancelar edição
                </button>

            </form>
        </section>

        <section class="lista">
            <h2>Produtos cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="lista-produtos">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
